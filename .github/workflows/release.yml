name: Build & Release Plugin

# 推 v* 标签：构建并发布 Release（dll + zip）；
# 手动触发（workflow_dispatch）：仅构建并上传 Actions 工件（不发布 Release）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4

      # SDK 不在本仓库：检出上游 MSLTeam/MSLX（公开仓库，dev 分支）提供 MSLX.SDK 源码
      - name: Checkout MSLX SDK source
        uses: actions/checkout@v4
        with:
          repository: MSLTeam/MSLX
          ref: dev
          path: MSLX-dev
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and pack
        shell: pwsh
        run: |
          # tag 触发时注入 tag 版本；手动构建沿用 csproj 版本，保持程序集与插件元数据一致。
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          ./MSLX.Plugin.Extras/pack.ps1 -SdkDir "$env:GITHUB_WORKSPACE/MSLX-dev/MSLX.SDK" -Version $ver

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mslx-plugin-android-extensions
          path: |
            MSLX.Plugin.Extras/dist/MSLX.Plugin.AndroidExtensions.dll
            MSLX.Plugin.Extras/dist/MSLX.Plugin.AndroidExtensions.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "MSLX.Plugin.Extras/dist/MSLX.Plugin.AndroidExtensions.dll" `
            "MSLX.Plugin.Extras/dist/MSLX.Plugin.AndroidExtensions.zip" `
            --title "MSLX Android 扩展插件 $env:GITHUB_REF_NAME" `
            --generate-notes
