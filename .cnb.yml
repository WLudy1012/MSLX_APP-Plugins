# CNB（cnb.cool）云构建：main push 构建校验；v* tag 构建并发布 CNB Release（dll + zip）。
# 本仓库为 GitHub WLudy1012/MSLX_APP-Plugins 的 CNB 直推镜像；
# MSLX.SDK 源码需从 GitHub（MSLTeam/MSLX dev）检出（本仓库 csproj 以 ProjectReference 引用），
# 插件面板前端产物 Frontend/dist 已入库，构建无需 Node。

main:
  push:
    - docker:
        image: mcr.microsoft.com/dotnet/sdk:10.0
        volumes:
          - /root/.nuget:cow
      stages:
        # dotnet/sdk 镜像只保证 SDK 本身。git 用于检出 MSLX.SDK 源码，zip 用于打包附件；
        # 两者缺失时先尝试补装（失败不阻断，后续步骤会给出更明确的报错）。
        - name: install build tools
          script: |
            set -eu
            if ! command -v git > /dev/null 2>&1; then
              apt-get update -qq || true
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates || true
            fi
            if ! command -v zip > /dev/null 2>&1; then
              apt-get update -qq || true
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends zip || true
            fi
            git --version || { echo "ERROR: 缺少 git，无法检出 MSLX.SDK 源码" >&2; exit 1; }
            command -v zip > /dev/null 2>&1 && zip -v | head -n 1 || echo "警告：缺少 zip，将在打包阶段重试安装" >&2
        - name: fetch MSLX SDK source
          script: |
            set -eu
            clone_sdk() {
              for url in \
                https://github.com/MSLTeam/MSLX.git \
                https://gh-proxy.com/https://github.com/MSLTeam/MSLX.git \
                https://ghfast.top/https://github.com/MSLTeam/MSLX.git; do
                echo "==> try clone: $url"
                if git clone --depth 1 -b dev "$url" MSLX-dev 2>/dev/null; then
                  return 0
                fi
                rm -rf MSLX-dev
              done
              return 1
            }
            # 兜底：git 协议被阻断时改用 codeload 归档（镜像站对 codeload 支持不完整，故放最后）
            fetch_sdk_tarball() {
              for url in \
                https://codeload.github.com/MSLTeam/MSLX/tar.gz/refs/heads/dev \
                https://ghfast.top/https://codeload.github.com/MSLTeam/MSLX/tar.gz/refs/heads/dev; do
                echo "==> try tarball: $url"
                mkdir -p MSLX-dev
                if curl -fL --retry 2 --connect-timeout 20 --max-time 900 -o /tmp/mslx-sdk.tar.gz "$url" \
                  && tar -xzf /tmp/mslx-sdk.tar.gz -C MSLX-dev --strip-components=1; then
                  rm -f /tmp/mslx-sdk.tar.gz
                  return 0
                fi
                rm -rf MSLX-dev /tmp/mslx-sdk.tar.gz
              done
              return 1
            }
            clone_sdk || fetch_sdk_tarball \
              || { echo "ERROR: 获取 MSLX SDK 源码失败（GitHub 与镜像站均不可达？）" >&2; exit 1; }
            test -f MSLX-dev/MSLX.SDK/MSLX.SDK.csproj

        - name: build plugin (release)
          script: |
            set -eu
            dotnet build MSLX.Plugin.Extras/MSLX.Plugin.Extras.csproj \
              -c Release --nologo \
              -p:MSLX_SDK_DIR="$PWD/MSLX-dev/MSLX.SDK"

        - name: verify embedded frontend
          script: |
            set -eu
            DLL=MSLX.Plugin.Extras/bin/Release/net10.0/MSLX.Plugin.AndroidThirdpartyAddons.dll
            [ -f "$DLL" ] || { echo "ERROR: 缺少构建产物 $DLL" >&2; exit 1; }
            grep -aq 'mslx-plugin-entry.js' "$DLL"
            grep -aq 'icon.png' "$DLL"
            ls -lh "$DLL"

$:
  tag_push:
    - docker:
        image: mcr.microsoft.com/dotnet/sdk:10.0
        volumes:
          - /root/.nuget:cow
      stages:
        - name: install build tools
          script: |
            set -eu
            if ! command -v git > /dev/null 2>&1; then
              apt-get update -qq || true
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates || true
            fi
            if ! command -v zip > /dev/null 2>&1; then
              apt-get update -qq || true
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends zip || true
            fi
            git --version || { echo "ERROR: 缺少 git，无法检出 MSLX.SDK 源码" >&2; exit 1; }
            command -v zip > /dev/null 2>&1 && zip -v | head -n 1 || echo "警告：缺少 zip，将在打包阶段重试安装" >&2
        - name: fetch MSLX SDK source
          script: |
            set -eu
            clone_sdk() {
              for url in \
                https://github.com/MSLTeam/MSLX.git \
                https://gh-proxy.com/https://github.com/MSLTeam/MSLX.git \
                https://ghfast.top/https://github.com/MSLTeam/MSLX.git; do
                echo "==> try clone: $url"
                if git clone --depth 1 -b dev "$url" MSLX-dev 2>/dev/null; then
                  return 0
                fi
                rm -rf MSLX-dev
              done
              return 1
            }
            # 兜底：git 协议被阻断时改用 codeload 归档（镜像站对 codeload 支持不完整，故放最后）
            fetch_sdk_tarball() {
              for url in \
                https://codeload.github.com/MSLTeam/MSLX/tar.gz/refs/heads/dev \
                https://ghfast.top/https://codeload.github.com/MSLTeam/MSLX/tar.gz/refs/heads/dev; do
                echo "==> try tarball: $url"
                mkdir -p MSLX-dev
                if curl -fL --retry 2 --connect-timeout 20 --max-time 900 -o /tmp/mslx-sdk.tar.gz "$url" \
                  && tar -xzf /tmp/mslx-sdk.tar.gz -C MSLX-dev --strip-components=1; then
                  rm -f /tmp/mslx-sdk.tar.gz
                  return 0
                fi
                rm -rf MSLX-dev /tmp/mslx-sdk.tar.gz
              done
              return 1
            }
            clone_sdk || fetch_sdk_tarball \
              || { echo "ERROR: 获取 MSLX SDK 源码失败（GitHub 与镜像站均不可达？）" >&2; exit 1; }
            test -f MSLX-dev/MSLX.SDK/MSLX.SDK.csproj

        - name: build plugin (tag version)
          script: |
            set -eu
            CUR_TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]' | sort -V | tail -1 || true)
            [ -n "$CUR_TAG" ] || CUR_TAG="${CNB_BRANCH:-}"
            [ -n "$CUR_TAG" ] || { echo "ERROR: 无法确定当前 tag（构建需要精确 tag）" >&2; exit 1; }
            VER=${CUR_TAG#v}
            echo "tag=$CUR_TAG version=$VER"
            dotnet build MSLX.Plugin.Extras/MSLX.Plugin.Extras.csproj \
              -c Release --nologo \
              -p:MSLX_SDK_DIR="$PWD/MSLX-dev/MSLX.SDK" \
              -p:Version="$VER"

        - name: collect artifacts
          script: |
            set -eu
            DLL=MSLX.Plugin.Extras/bin/Release/net10.0/MSLX.Plugin.AndroidThirdpartyAddons.dll
            [ -f "$DLL" ] || { echo "ERROR: 缺少构建产物 $DLL" >&2; exit 1; }
            grep -aq 'mslx-plugin-entry.js' "$DLL"
            grep -aq 'icon.png' "$DLL"
            cp "$DLL" MSLX.Plugin.AndroidThirdpartyAddons.dll
            if ! command -v zip >/dev/null 2>&1; then
              apt-get update -qq && apt-get install -y -qq zip
            fi
            zip -q MSLX.Plugin.AndroidThirdpartyAddons.zip MSLX.Plugin.AndroidThirdpartyAddons.dll MSLX.Plugin.Extras/README.md
            ls -lh MSLX.Plugin.AndroidThirdpartyAddons.dll MSLX.Plugin.AndroidThirdpartyAddons.zip

        - name: prepare release notes
          script: |
            set -eu
            CUR_TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]' | sort -V | tail -1 || true)
            [ -n "$CUR_TAG" ] || CUR_TAG="${CNB_BRANCH:-unknown}"
            git fetch --tags --force --quiet 2>/dev/null || true
            # 兜底：tag 未同步到本地时用 HEAD，保证 git log 不会因"未知修订号"整段失败
            REV="$CUR_TAG"
            git rev-parse --verify --quiet "${CUR_TAG}^{commit}" > /dev/null || REV=HEAD
            PREV_TAG=$(git tag --list 'v*' | grep -v "^${CUR_TAG}$" | sort -V | tail -1 || true)
            echo "当前 tag=$CUR_TAG 上一版本=${PREV_TAG:-<无>}"
            {
              echo "# MSLX Android 扩展插件 $CUR_TAG"
              echo ""
              if [ -n "$PREV_TAG" ]; then
                echo "自 \`$PREV_TAG\` 以来的提交："
                echo ""
                git log --no-merges --pretty=format:"- %s" "${PREV_TAG}..${REV}"
              else
                echo "> 未能确定上一版本 tag，列出最近 15 条提交。"
                echo ""
                git log -n 15 --no-merges --pretty=format:"- %s" "${REV}"
              fi
              echo ""
              echo ""
              echo "## 产物"
              echo ""
              echo "| 文件 | 说明 | SHA-256 |"
              echo "| --- | --- | --- |"
              echo "| \`MSLX.Plugin.AndroidThirdpartyAddons.dll\` | 插件本体（含内嵌面板页面），放入 Daemon \`Plugins/\` 安装 | \`$(sha256sum MSLX.Plugin.AndroidThirdpartyAddons.dll | awk '{print $1}')\` |"
              echo "| \`MSLX.Plugin.AndroidThirdpartyAddons.zip\` | DLL + README 压缩包 | \`$(sha256sum MSLX.Plugin.AndroidThirdpartyAddons.zip | awk '{print $1}')\` |"
            } > CNB_RELEASE.md
            cat CNB_RELEASE.md

        - name: create cnb release
          type: git:release
          options:
            descriptionFromFile: CNB_RELEASE.md
            latest: true

        - name: upload release assets
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - MSLX.Plugin.AndroidThirdpartyAddons.dll
              - MSLX.Plugin.AndroidThirdpartyAddons.zip
